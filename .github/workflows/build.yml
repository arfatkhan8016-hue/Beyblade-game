name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          FILE=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$FILE" ]; then echo "settings.gradle.kts repo me nahi mili!"; ls -R; exit 1; fi
          cd "$(dirname "$FILE")"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BeybladeGame-debug-apk
          path: "**/app-debug.apk"
